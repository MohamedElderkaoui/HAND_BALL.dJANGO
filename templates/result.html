<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado de la Predicción</title>
</head>
<body>
    <h1>Resultado de la Predicción</h1>
    <p>La predicción de rendimiento del jugador es: 
        {% if predictions == 1 %}
            Buen rendimiento
        {% else %}
            Mal rendimiento
        {% endif %}
    </p>

    <!-- Si quieres mostrar más detalles sobre la predicción -->
    <p>Predicción numérica: {{ predictions }}</p>

    <!-- O podrías poner un enlace para volver atrás o ir a otra página -->
    <a href="/">Volver a la página principal</a>
</body>
</html>
